<header class="border-b border-white/10 bg-gray-900/95 backdrop-blur-xl">
    <div class="mx-auto flex flex-col gap-4 px-6 py-4 lg:flex-row lg:items-center lg:justify-between lg:px-8">
        <a href="{% url 'home' %}" class="flex items-center gap-3 text-white">
            <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-indigo-500 text-lg font-semibold">B</span>
            <div>
                <p class="text-lg font-semibold">BlogAPP</p>
                <p class="text-sm text-gray-400">Developer blogging</p>
            </div>
        </a>
        <div class="flex flex-wrap items-center justify-end gap-3">
            <a href="{% url 'home' %}" class="rounded-full bg-white/5 px-4 py-2 text-sm font-semibold text-indigo-300 hover:bg-white/10">Home</a>
            <a href="{% url 'blog_feed' %}" class="rounded-full bg-white/5 px-4 py-2 text-sm font-semibold text-indigo-300 hover:bg-white/10">Feed</a>
            {% if user.is_authenticated %}
                {% if user.is_superuser %}
                    <a href="{% url 'admin_home' %}" class="rounded-full bg-white/5 px-4 py-2 text-sm font-semibold text-indigo-300 hover:bg-white/10">Dashboard</a>
                {% else %}
                    <a href="{% url 'user_home' %}" class="rounded-full bg-white/5 px-4 py-2 text-sm font-semibold text-indigo-300 hover:bg-white/10">My Dashboard</a>
                {% endif %}
                <form method="post" action="{% url 'logout' %}" class="ml-0">
                    {% csrf_token %}
                    <button type="submit" class="rounded-full bg-indigo-500 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-400">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="rounded-full bg-indigo-500 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-400">Login</a>
            {% endif %}
        </div>
    </div>
</header>
